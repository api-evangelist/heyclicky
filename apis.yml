name: Heyclicky
description: Heyclicky (product name Clicky) is a consumer macOS application from the Y Combinator
  Spring 2026 batch that puts an AI assistant right next to your cursor. In Talk Mode a hotkey lets
  you ask about whatever is on screen and get spoken, on-screen guidance; in Agent Mode you can command
  autonomous agents to build, research, or perform tasks in the background, and it can connect to
  services like Notion, Gmail, and Calendar. The app is screen-aware, works across any application
  with no plugins, and ships as a notarized macOS binary distributed via a Sparkle appcast on GitHub.
  Heyclicky is a consumer desktop product; it does not currently publish a public developer API,
  SDK, or OpenAPI surface.
